[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1628"
secondaryBackgroundColor = "#12233D"
textColor = "#E6EEF8"

[server]
# Upload ceiling enforced by Streamlit itself (MB). Keep in sync with
# MAX_UPLOAD_MB in config.py.
maxUploadSize = 25

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
